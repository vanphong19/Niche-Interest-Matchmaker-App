name: Build Main

on:
  push:
    branches:
      - main

concurrency:
  group: build-main
  cancel-in-progress: false

jobs:
  build:
    name: Build, Tag & Release (Production)
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Cache pub
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Cache build_runner
        uses: actions/cache@v4
        with:
          path: |
            .dart_tool/build
          key: ${{ runner.os }}-build-${{ hashFiles('lib/**') }}

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate Code
        run: dart run build_runner build --delete-conflicting-outputs

      # ── Version Management (Read-only on main) ─────────────────────────────
      - name: Read Current Version from pubspec.yaml
        id: version
        run: |
          FULL_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //')
          VERSION_NAME=$(echo "$FULL_VERSION" | cut -d'+' -f1)
          VERSION_CODE=$(echo "$FULL_VERSION" | cut -d'+' -f2)

          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "FULL_VERSION=$FULL_VERSION" >> $GITHUB_OUTPUT
          echo "TAG_NAME=v${VERSION_NAME}+${VERSION_CODE}" >> $GITHUB_OUTPUT

          echo "✅ Using version from merged source: $FULL_VERSION"

      # ── Signing (ĐÃ SỬA CHO PROD) ───────────────────────────────────────────
      - name: Restore Signing Keys
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release-keystore.jks

      # ── Build (ĐÃ SỬA THÊM FLAVOR) ──────────────────────────────────────────
      - name: Build APK (Release)
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEYSTORE_PATH: "release-keystore.jks"
        run: |
          flutter build apk --release --flavor prod --target lib/main.dart \
            --build-name=${{ steps.version.outputs.VERSION_NAME }} \
            --build-number=${{ steps.version.outputs.VERSION_CODE }}

      - name: Rename APK
        run: |
          mv build/app/outputs/flutter-apk/app-prod-release.apk \
             build/app/outputs/flutter-apk/app-release-${{ steps.version.outputs.FULL_VERSION }}.apk

      # ── Tag & Release ───────────────────────────────────────────────────────
      - name: Create Git Tag
        run: |
          if git ls-remote --exit-code --tags origin "${{ steps.version.outputs.TAG_NAME }}" >/dev/null 2>&1; then
            echo "Tag already exists on origin: ${{ steps.version.outputs.TAG_NAME }}"
          else
            git tag ${{ steps.version.outputs.TAG_NAME }}
            git push origin ${{ steps.version.outputs.TAG_NAME }}
          fi

      - name: Create GitHub Release (Production)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.TAG_NAME }}
          name: "v${{ steps.version.outputs.VERSION_NAME }}+${{ steps.version.outputs.VERSION_CODE }}"
          body: |
            ## 🚀 Production Release

            - **Branch:** `main`
            - **Version Name:** `${{ steps.version.outputs.VERSION_NAME }}`
            - **Version Code:** `${{ steps.version.outputs.VERSION_CODE }}`
            - **Commit:** `${{ github.sha }}`

            > This is a **stable production release**. Download the APK below to distribute manually.
          prerelease: false
          generate_release_notes: true
          files: |
            build/app/outputs/flutter-apk/app-release-${{ steps.version.outputs.FULL_VERSION }}.apk
