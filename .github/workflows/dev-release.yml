name: Build Develop

on:
  push:
    branches:
      - dev

concurrency:
  group: build-develop
  cancel-in-progress: false

jobs:
  build:
    if: "${{ !startsWith(github.event.head_commit.message, 'ci: bump versionCode to') }}"
    name: Bump Version, Build, Tag & Release (Develop)
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}
          persist-credentials: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Cache pub
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Cache build_runner
        uses: actions/cache@v4
        with:
          path: |
            .dart_tool/build
          key: ${{ runner.os }}-build-${{ hashFiles('lib/**') }}

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ── Version Management ──────────────────────────────────────────────────

      - name: Read Current Version from pubspec.yaml
        id: version
        run: |
          FULL_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | tr -d '\r')
          VERSION_NAME=$(echo "$FULL_VERSION" | cut -d'+' -f1)
          RAW_VERSION_CODE=$(echo "$FULL_VERSION" | cut -s -d'+' -f2)

          if [ -z "$VERSION_NAME" ]; then
            echo "❌ Invalid version in pubspec.yaml: '$FULL_VERSION'"
            exit 1
          fi

          if [ -z "$RAW_VERSION_CODE" ]; then
            echo "⚠️ Missing versionCode in pubspec ('$FULL_VERSION'). Trying to recover from latest tag."
            git fetch --tags --force
            RECOVERED_CODE=$(git tag -l "develop/v${VERSION_NAME}+*" \
              | sed -nE "s#^develop/v${VERSION_NAME}\\+([0-9]+)$#\\1#p" \
              | sort -n \
              | tail -1)

            RECOVER_SOURCE="tag"

            if [ -z "$RECOVERED_CODE" ]; then
              echo "⚠️ No matching develop tag found. Trying to recover from pubspec history on this branch."
              RECOVERED_CODE=$(git log --format='%H' -- pubspec.yaml | while read -r SHA; do
                HIST_VERSION=$(git show "${SHA}:pubspec.yaml" 2>/dev/null | sed -n 's/^version: //p' | tr -d '\r')
                HIST_CODE=$(echo "$HIST_VERSION" | cut -s -d'+' -f2)

                if [[ "$HIST_CODE" =~ ^[0-9]+$ ]]; then
                  echo "$HIST_CODE"
                  break
                fi
              done)
              RECOVER_SOURCE="history"
            fi

            if [ -z "$RECOVERED_CODE" ]; then
              echo "❌ Cannot recover versionCode for ${VERSION_NAME}. No valid code found in tags or pubspec history."
              exit 1
            fi

            VERSION_CODE=$RECOVERED_CODE
            echo "ℹ️ Recovered versionCode from ${RECOVER_SOURCE}: $VERSION_CODE"
          elif [[ "$RAW_VERSION_CODE" =~ ^[0-9]+$ ]]; then
            VERSION_CODE=$RAW_VERSION_CODE
          else
            echo "❌ Invalid versionCode in pubspec.yaml: '$RAW_VERSION_CODE'"
            exit 1
          fi

          NEW_VERSION_CODE=$((VERSION_CODE + 1))
          NEW_FULL_VERSION="${VERSION_NAME}+${NEW_VERSION_CODE}"

          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "VERSION_CODE=$NEW_VERSION_CODE" >> $GITHUB_OUTPUT
          echo "NEW_FULL_VERSION=$NEW_FULL_VERSION" >> $GITHUB_OUTPUT
          echo "TAG_NAME=develop/v${VERSION_NAME}+${NEW_VERSION_CODE}" >> $GITHUB_OUTPUT

          echo "✅ Bumping version: $FULL_VERSION → $NEW_FULL_VERSION"

      - name: Bump versionCode in pubspec.yaml (local only)
        run: |
          sed -i "s/^version: .*/version: ${{ steps.version.outputs.NEW_FULL_VERSION }}/" pubspec.yaml

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate Code
        run: dart run build_runner build --delete-conflicting-outputs

      # ── Signing ─────────────────────────────────────────────────────────────

      - name: Restore Signing Keys
        env:
          DEV_KEYSTORE_BASE64: ${{ secrets.DEV_KEYSTORE_BASE64 }}
        run: |
          echo "$DEV_KEYSTORE_BASE64" | base64 --decode > android/app/dev-keystore.jks

      # ── Build ───────────────────────────────────────────────────────────────

      - name: Build APK (Release Dev)
        env:
          DEV_KEY_ALIAS: ${{ secrets.DEV_KEY_ALIAS }}
          DEV_KEY_PASSWORD: ${{ secrets.DEV_KEY_PASSWORD }}
          DEV_STORE_PASSWORD: ${{ secrets.DEV_STORE_PASSWORD }}
          KEYSTORE_PATH: "dev-keystore.jks"
        run: |
          flutter build apk --release --flavor dev --target lib/main.dart --build-name=${{ steps.version.outputs.VERSION_NAME }} --build-number=${{ steps.version.outputs.VERSION_CODE }}

      - name: Rename APK
        run: |
          mv build/app/outputs/flutter-apk/app-dev-release.apk build/app/outputs/flutter-apk/app-develop-${{ steps.version.outputs.NEW_FULL_VERSION }}.apk

      # ── Commit version bump ─────────────────────────────────────────────────

      - name: Commit Version Bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml
          git commit -m "ci: bump versionCode to ${{ steps.version.outputs.VERSION_CODE }} [skip ci]"
          git push origin dev

      # ── Tag & Release ───────────────────────────────────────────────────────

      - name: Create Git Tag
        run: |
          git tag ${{ steps.version.outputs.TAG_NAME }}
          git push origin ${{ steps.version.outputs.TAG_NAME }}

      - name: Create GitHub Release (Pre-release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.TAG_NAME }}
          name: "Develop – v${{ steps.version.outputs.VERSION_NAME }}+${{ steps.version.outputs.VERSION_CODE }}"
          body: |
            ## 🧪 Internal Test Build

            - **Branch:** `dev`
            - **Version Name:** `${{ steps.version.outputs.VERSION_NAME }}`
            - **Version Code:** `${{ steps.version.outputs.VERSION_CODE }}`
            - **Commit:** `${{ github.sha }}`

            > This is an **internal pre-release** for QA/testing. Not for production.
          prerelease: true
          generate_release_notes: true
          files: |
            build/app/outputs/flutter-apk/app-develop-${{ steps.version.outputs.NEW_FULL_VERSION }}.apk
