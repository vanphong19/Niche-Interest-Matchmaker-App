name: Build Develop

on:
  push:
    branches:
      - dev # Sửa lại tên nhánh cho đúng với hệ thống của bạn

concurrency:
  group: build-develop
  cancel-in-progress: false

jobs:
  build:
    name: Bump Version, Build, Tag & Release (Develop)
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Cache pub
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Cache build_runner
        uses: actions/cache@v4
        with:
          path: |
            .dart_tool/build
          key: ${{ runner.os }}-build-${{ hashFiles('lib/**') }}

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install Dependencies
        run: flutter pub get

      # ĐÃ SỬA: Thay make generate bằng lệnh chuẩn của Flutter
      - name: Generate Code
        run: dart run build_runner build --delete-conflicting-outputs

      # ── Version Management ──────────────────────────────────────────────────
      - name: Read Current Version from pubspec.yaml
        id: version
        run: |
          FULL_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //')
          VERSION_NAME=$(echo "$FULL_VERSION" | cut -d'+' -f1)
          VERSION_CODE=$(echo "$FULL_VERSION" | cut -d'+' -f2)

          NEW_VERSION_CODE=$((VERSION_CODE + 1))
          NEW_FULL_VERSION="${VERSION_NAME}+${NEW_VERSION_CODE}"

          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "VERSION_CODE=$NEW_VERSION_CODE" >> $GITHUB_OUTPUT
          echo "NEW_FULL_VERSION=$NEW_FULL_VERSION" >> $GITHUB_OUTPUT
          echo "TAG_NAME=develop/v${VERSION_NAME}+${NEW_VERSION_CODE}" >> $GITHUB_OUTPUT

          echo "✅ Bumping version: $FULL_VERSION → $NEW_FULL_VERSION"

      - name: Bump versionCode in pubspec.yaml (local only)
        run: |
          sed -i "s/^version: .*/version: ${{ steps.version.outputs.NEW_FULL_VERSION }}/" pubspec.yaml

      # ── Signing (ĐÃ SỬA ĐỂ DÙNG CẤU HÌNH DEV) ────────────────────────────────
      - name: Restore Signing Keys
        env:
          DEV_KEYSTORE_BASE64: ${{ secrets.DEV_KEYSTORE_BASE64 }}
        run: |
          echo "$DEV_KEYSTORE_BASE64" | base64 --decode > android/app/dev-keystore.jks

      # ── Build (ĐÃ SỬA THÊM FLAVOR) ──────────────────────────────────────────
      - name: Build APK (Release Dev)
        env:
          DEV_KEY_ALIAS: ${{ secrets.DEV_KEY_ALIAS }}
          DEV_KEY_PASSWORD: ${{ secrets.DEV_KEY_PASSWORD }}
          DEV_STORE_PASSWORD: ${{ secrets.DEV_STORE_PASSWORD }}
          KEYSTORE_PATH: "dev-keystore.jks"
        run: |
          flutter build apk --release --flavor dev --target lib/main_dev.dart \
            --build-name=${{ steps.version.outputs.VERSION_NAME }} \
            --build-number=${{ steps.version.outputs.VERSION_CODE }}

      # ĐÃ SỬA: Đường dẫn gốc của file apk khi dùng flavor dev sẽ có tên là app-dev-release.apk
      - name: Rename APK
        run: |
          mv build/app/outputs/flutter-apk/app-dev-release.apk \
             build/app/outputs/flutter-apk/app-develop-${{ steps.version.outputs.NEW_FULL_VERSION }}.apk

      # ── Commit version bump ─────────────────────────────────────────────────
      - name: Commit Version Bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml
          git commit -m "ci: bump versionCode to ${{ steps.version.outputs.VERSION_CODE }} [skip ci]"
          git push origin dev

      # ── Tag & Release ───────────────────────────────────────────────────────
      - name: Create Git Tag
        run: |
          git tag ${{ steps.version.outputs.TAG_NAME }}
          git push origin ${{ steps.version.outputs.TAG_NAME }}

      - name: Create GitHub Release (Pre-release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.TAG_NAME }}
          name: "Develop – v${{ steps.version.outputs.VERSION_NAME }}+${{ steps.version.outputs.VERSION_CODE }}"
          body: |
            ## 🧪 Internal Test Build

            - **Branch:** `dev`
            - **Version Name:** `${{ steps.version.outputs.VERSION_NAME }}`
            - **Version Code:** `${{ steps.version.outputs.VERSION_CODE }}`
            - **Commit:** `${{ github.sha }}`

            > This is an **internal pre-release** for QA/testing. Not for production.
          prerelease: true
          generate_release_notes: true
          files: |
            build/app/outputs/flutter-apk/app-develop-${{ steps.version.outputs.NEW_FULL_VERSION }}.apk
